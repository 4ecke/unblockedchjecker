<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Playing...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #000;
      color: #e0ddd5;
      font-family: 'Courier Prime', monospace;
      height: 100%;
      overflow: hidden;
    }

    /* Full-screen layout */
    #shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      height: 44px;
      background: #0c0c0c;
      border-bottom: 1px solid #1f1f1f;
      flex-shrink: 0;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 5px 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .back-btn:hover { border-color: #f0a500; color: #f0a500; }

    #game-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: #f0a500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .year-tag {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #444;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Emulator container */
    #game-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Loading state */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 5;
    }

    .loading-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 0.1em;
      color: #f0a500;
    }

    .loading-sub {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #444;
      text-transform: uppercase;
    }

    .loading-bar-wrap {
      width: 220px;
      height: 2px;
      background: #1a1a1a;
    }

    .loading-bar {
      height: 100%;
      background: #f0a500;
      width: 0%;
      animation: loadpulse 1.8s ease-in-out infinite;
    }

    @keyframes loadpulse {
      0%   { width: 0%; opacity: 1; }
      70%  { width: 85%; opacity: 1; }
      90%  { width: 90%; opacity: 0.5; }
      100% { width: 90%; opacity: 0.5; }
    }

    /* CRT scanlines over everything */
    #shell::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.10) 3px,
        rgba(0,0,0,0.10) 4px
      );
      pointer-events: none;
      z-index: 9000;
    }
  </style>
</head>
<body>
<div id="shell">

  <div id="topbar">
    <a class="back-btn" href="index.html">← Library</a>
    <div id="game-title">Loading...</div>
    <div class="year-tag" id="year-tag"></div>
  </div>

  <div id="game-wrap">
    <!-- Loading screen shown until emulator is ready -->
    <div id="loading-screen">
      <div class="loading-title" id="loading-title">LOADING</div>
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
      <div class="loading-sub">Initialising emulator</div>
    </div>
    <div id="game"></div>
  </div>

</div>

<script>
  // Parse URL params
  const params = new URLSearchParams(window.location.search);
  const rom   = params.get('rom')   || '';
  const title = params.get('title') || 'Game';
  const year  = params.get('year')  || '';

  // Set UI
  document.title = title + ' — CARTRIDGE';
  document.getElementById('game-title').textContent = title;
  document.getElementById('year-tag').textContent   = year;
  document.getElementById('loading-title').textContent = title.toUpperCase();

  if (!rom) {
    document.getElementById('loading-screen').innerHTML =
      '<div style="color:#f0a500;font-family:Bebas Neue,sans-serif;font-size:28px;letter-spacing:.1em">No ROM specified</div>' +
      '<a href="index.html" style="color:#888;font-size:12px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none">← Back to library</a>';
  } else {
    // EmulatorJS config — must be set before loader.js
    window.EJS_player        = '#game';
    window.EJS_core          = 'snes';
    window.EJS_gameUrl       = rom;
    window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_VirtualGamepad = true;
    window.EJS_color         = '#f0a500';
    window.EJS_startOnLoaded = true;
    window.EJS_fullscreenOnLoaded = false;

    // Hide loading screen when emulator fires its ready event
    window.EJS_onGameStart = function() {
      const ls = document.getElementById('loading-screen');
      if (ls) {
        ls.style.transition = 'opacity 0.4s';
        ls.style.opacity = '0';
        setTimeout(() => ls.remove(), 420);
      }
    };

    // Load EmulatorJS
    const s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
